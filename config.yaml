# =============================================================================
# Configuración única del estudio
# -----------------------------------------------------------------------------
# Para repetir el análisis con otro país o periodo, basta con editar este
# archivo. Ningún script contiene umbrales, fechas, países ni textos con valores
# escritos a mano: todo se lee de aquí o de los resultados calculados.
# =============================================================================

proyecto:
  titulo: "Respuesta sanitaria de Bolivia frente al COVID-19"
  autor: "Henry Pilco Cussy"
  institucion: "Universidad Privada Franz Tamayo"
  carrera: "Ingeniería de Sistemas"

# Semilla única para todo procedimiento aleatorio (k-means, bosques, validación).
semilla: 42

# -----------------------------------------------------------------------------
# Archivos de entrada (rutas relativas a la raíz del proyecto)
# -----------------------------------------------------------------------------
archivos:
  municipios: "datos/crudos/mun_covid_se30.csv"
  owid: "datos/crudos/owid-covid-data.csv"

# Nombres que se asignan a las columnas del archivo municipal, en su orden
# original. Se asignan por posición para no depender de los encabezados crudos.
columnas_municipios:
  - cod_departamento
  - departamento
  - cod_municipio
  - municipio
  - semana
  - confirmados
  - activos
  - fallecidos
  - recuperados

# Columnas de OWID que se conservan en los datos procesados (ver DICCIONARIO_DATOS.md).
columnas_owid:
  - iso_code
  - continent
  - location
  - date
  - total_cases
  - new_cases
  - total_deaths
  - total_cases_per_million
  - new_cases_per_million
  - total_deaths_per_million
  - total_tests_per_thousand
  - stringency_index
  - population
  - hospital_beds_per_thousand
  - human_development_index
  - median_age

# -----------------------------------------------------------------------------
# País foco y comparación internacional
# -----------------------------------------------------------------------------
pais:
  nombre: "Bolivia"            # tal como aparece en la columna `location` de OWID
  iso: "BOL"
  comparacion:                 # países vecinos o de referencia (nombres OWID)
    - "Argentina"
    - "Brazil"
    - "Chile"
    - "Colombia"
    - "Ecuador"
    - "Paraguay"
    - "Peru"
